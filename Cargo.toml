[package]
name = "codex-state-kit"
version = "0.0.12"
edition = "2021"
rust-version = "1.85"
description = "Transparent local reverse proxy for Codex HTTP SSE"
exclude = ["frontend", "dist", "node_modules"]

[lib]
name = "codex_state_kit"
path = "src/lib.rs"

[workspace]
members = ["src-tauri"]
resolver = "2"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
futures-util = "0.3"
http = "1"
## Real macOS hosts presenting the Mac profile use native-tls/Security.framework;
## every other virtual-device HTTP combination uses the deterministic AWS-LC
## rustls profile so Linux/Windows OpenSSL or SChannel details do not leak.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "rustls-tls-no-provider", "http2", "stream", "json", "socks", "gzip", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-socks = "0.5"
tokio-util = "0.7"
# Keep the Responses WebSocket transport aligned with Codex's client.  The
# upstream client uses OpenAI's fork because crates.io tungstenite does not
# implement RFC 7692 permessage-deflate yet.
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite.git", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186", features = ["rustls-tls-native-roots"] }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs.git", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f", features = ["deflate"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
toml = "0.8"
toml_edit = "0.22"
base64 = "0.22"
serde_yaml = "0.9"
url = "2"
rand = "0.9"
uuid = { version = "1", features = ["v4", "v5", "v7"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
flate2 = "1"
zstd = "0.13"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
minisign-verify = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
