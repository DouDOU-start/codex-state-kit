[package]
name = "codex-state-kit-desktop"
version = "0.0.12"
description = "Desktop manager for the Codex reverse proxy"
edition = "2021"
rust-version = "1.85"

[lib]
name = "codex_state_kit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-state-kit-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
codex-state-kit = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macos-private-api matches app.macOSPrivateApi (transparent window on macOS).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
anyhow = "1"
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
