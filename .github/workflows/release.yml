name: 发布桌面安装包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      finalize_only:
        description: "仅验证并公开已完整构建的草稿，不重新构建安装包"
        required: false
        default: false
        type: boolean
      notes:
        description: "发布说明。留空则使用标签附注，再没有则用默认文案"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.verify.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
      - name: 检查更新清单验证器
        run: node --test tools/verify-updater-manifest.test.mjs
      - name: 检查版本与签名配置
        id: verify
        uses: actions/github-script@v7
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          script: |
            if (!process.env.SIGNING_KEY || !process.env.SIGNING_PASSWORD) {
              throw new Error('请先配置 TAURI_SIGNING_PRIVATE_KEY 和 TAURI_SIGNING_PRIVATE_KEY_PASSWORD Secrets');
            }
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('正式发布必须使用稳定 SemVer 版本');
            for (const file of ['Cargo.toml', 'src-tauri/Cargo.toml']) {
              const rustVersion = fs.readFileSync(file, 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
              if (rustVersion !== version) throw new Error(`${file} 版本与 package.json 不一致`);
            }
            const tag = `v${version}`;
            if (context.ref.startsWith('refs/tags/') && context.ref !== `refs/tags/${tag}`) throw new Error('标签与安装包版本不一致');
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (!data.draft) throw new Error('该版本已经发布；请提高版本号，避免覆盖已有更新包');
            } catch (error) { if (error.status !== 404) throw error; }
            core.setOutput('tag', tag);

  publish:
    needs: preflight
    if: ${{ !inputs.finalize_only }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Serialize latest.json merges; the release stays draft until all targets are complete.
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            rust_target: ""
            target_args: ""
            core_platform: windows
            core_arch: amd64
          - name: macOS Apple Silicon
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            target_args: --target aarch64-apple-darwin
            core_platform: macos
            core_arch: arm64
          - name: macOS Intel
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            target_args: --target x86_64-apple-darwin
            core_platform: macos
            core_arch: amd64
          - name: Linux x64
            runner: ubuntu-22.04
            rust_target: ""
            target_args: ""
            core_platform: linux
            core_arch: amd64

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取发布说明
        id: notes
        shell: bash
        env:
          MANUAL_NOTES: ${{ github.event.inputs.notes }}
        run: |
          default='下载对应系统的安装包即可。Mac 版本当前为未公证构建；首次打开时请按系统提示允许应用运行。Linux 版本提供 AppImage 安装包。'
          notes="${MANUAL_NOTES:-}"
          if [ -z "$notes" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            notes="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          fi
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="$default"
          fi
          delim="NOTES_${RANDOM}_${RANDOM}"
          {
            echo "body<<${delim}"
            printf '%s\n' "$notes"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 准备 Mihomo 内核（Windows）
        if: matrix.core_platform == 'windows'
        shell: pwsh
        run: ./tools/prepare-mihomo.ps1

      - name: 准备 Mihomo 内核（macOS）
        if: matrix.core_platform == 'macos'
        run: bash ./tools/prepare-mihomo.sh "${{ matrix.core_arch }}"

      - name: 安装 Linux Tauri 依赖
        if: matrix.core_platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: 安装前端依赖
        run: corepack pnpm install --frozen-lockfile

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Codex State Kit v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target_args }}
          retryAttempts: 2
          releaseAssetNamePattern: "[name]-[version]-[platform]-[arch][setup].[ext]"
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  finalize:
    needs: [preflight, publish]
    if: ${{ always() && needs.preflight.result == 'success' && (needs.publish.result == 'success' || (inputs.finalize_only && needs.publish.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证更新清单并公开发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/updater"
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/updater/assets.json"
          node tools/verify-updater-manifest.mjs "$RUNNER_TEMP/updater/latest.json" "$RUNNER_TEMP/updater/assets.json" "$RELEASE_TAG" "$GH_REPO"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/updater/latest.json" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
